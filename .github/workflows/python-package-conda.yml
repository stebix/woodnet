name: woodnet package CI with conda

on: [push]

jobs:
  build-linux:
    name: job-conda-(${{ matrix.python-version }}::${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          activate-environment: woodanalysis
          environment-file: environment-cpu.yaml

      - name: Conda info
        shell: bash -el {0}
        run: |
          conda info
          conda list




